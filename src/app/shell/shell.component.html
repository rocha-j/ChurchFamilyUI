@if (showIntro) {
  <app-intro (done)="onIntroDone()"></app-intro>
}

<div class="shell" [class.hidden]="showIntro">
  <app-header></app-header>

  <main class="content"
    [class.animating]="isAnimating"
    [@routeAnimation]="getRouteState(outlet)"
    (@routeAnimation.start)="onAnimationStart()"
    (@routeAnimation.done)="onAnimationDone()">
    <router-outlet #outlet="outlet"></router-outlet>
  </main>

  <app-footer></app-footer>
</div>
